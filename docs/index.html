<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrimStudio · GitHub и Boosty</title>
<meta name="description" content="GrimStudio — профессиональная 3D-студия грима. Бесплатно и open-source. GitHub и Boosty.">
<style>
  :root {
    --bg: #141210;
    --panel: #1e1a15;
    --gold: #c9a86a;
    --gold-bright: #ffd24a;
    --text: #efe8dc;
    --muted: #9c927f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(201,168,106,0.12), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px;
    text-align: center;
    padding: 36px 28px;
    background: var(--panel);
    border: 1px solid rgba(201,168,106,0.25);
    border-radius: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .icon {
    width: 88px; height: 88px; border-radius: 20px;
    display: block; margin: 0 auto 16px;
    box-shadow: 0 6px 24px rgba(201,168,106,0.25);
  }
  h1 { font-size: 30px; letter-spacing: 0.5px; color: var(--gold); margin-bottom: 6px; }
  .sub { font-size: 14.5px; color: var(--muted); line-height: 1.45; margin-bottom: 28px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 16px 18px;
    margin-bottom: 14px;
    font-size: 17px; font-weight: 700;
    text-decoration: none;
    border-radius: 14px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.btn:active { transform: scale(0.97); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn-github {
    background: #f5f0e6; color: #17130e;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .btn-boosty {
    background: linear-gradient(135deg, #c9a86a, #b48c46);
    color: #17130e;
    box-shadow: 0 8px 24px rgba(201,168,106,0.35);
  }
  .free {
    margin-top: 22px;
    font-size: 13px; color: var(--muted);
    line-height: 1.5;
  }
  .free b { color: var(--gold-bright); }
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="app-icon.png" alt="GrimStudio">
  <h1>GrimStudio</h1>
  <div class="sub">Профессиональная 3D-студия грима.<br>Рисуй макияж и face-paint прямо на 3D-лице.</div>

  <a class="btn btn-github" href="https://github.com/LatovaRR/grimstudio" rel="noopener">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    GitHub · исходники и релизы
  </a>

  <a class="btn btn-boosty" href="https://boosty.to/latovarr" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 4 8v8l8 6 8-6V8l-8-6Zm0 2.6 5.7 4.3v6.2L12 19.4l-5.7-4.3V8.9L12 4.6Zm0 3.2c-1.9 0-3.4 1.5-3.4 3.4s1.5 3.4 3.4 3.4 3.4-1.5 3.4-3.4-1.5-3.4-3.4-3.4Z"/></svg>
    Boosty · поддержать автора
  </a>

  <div class="free">Приложение <b>полностью бесплатное</b> и open-source (MIT).<br>Если оно вам полезно — поддержка автора на Boosty помогает проекту развиваться.</div>
</div>
</body>
</html>
